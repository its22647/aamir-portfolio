<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Muhammad Aamir Bakhsh</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <style>
        :root {
            --bg-dark: #050811;
            --card-bg: rgba(13, 20, 36, 0.85);
            --card-border: rgba(0, 242, 254, 0.2);
            --primary-cyan: #00f2fe;
            --neon-green: #00ff88;
            --text-main: #f8fafc;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .contact-box {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        h2 {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 25px;
        }

        .contact-row {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 242, 254, 0.15);
            margin: 15px 0;
            padding: 16px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-val {
            color: var(--primary-cyan);
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-copy {
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-copy:hover {
            background: var(--neon-green);
            color: #000;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--text-main);
            text-decoration: none;
            opacity: 0.8;
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--primary-cyan);
            opacity: 1;
        }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            background: var(--neon-green);
            color: #000;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 700;
            display: none;
        }
    </style>
</head>
<body>

<div class="contact-box" data-aos="zoom-in">
    <h2>Get In Touch</h2>

    <div class="contact-row">
        <span class="info-val" id="email"><i class="fa-regular fa-envelope"></i> m.aamirbakhsh@gmail.com</span>
        <button class="btn-copy" onclick="copyText('email')">Copy</button>
    </div>

    <div class="contact-row">
        <span class="info-val" id="phone"><i class="fa-solid fa-phone"></i> +92 335 1483179</span>
        <button class="btn-copy" onclick="copyText('phone')">Copy</button>
    </div>

    <div class="contact-row">
        <span class="info-val"><i class="fa-solid fa-location-dot"></i> Rawalpindi, Pakistan</span>
        <span style="color: var(--neon-green); font-size: 0.8rem;">Location</span>
    </div>

    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Portfolio</a>
</div>

<div id="toast" class="toast-msg">Copied to clipboard!</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
<script>
    AOS.init({ duration: 800 });

    function copyText(id) {
        const text = document.getElementById(id).innerText;
        navigator.clipboard.writeText(text.trim()).then(() => {
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        });
    }
</script>
</body>
</html>
